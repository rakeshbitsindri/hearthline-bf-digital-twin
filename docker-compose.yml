services:
  api:
    image: python:3.11-slim
    working_dir: /srv
    volumes:
      - ./:/srv
    command: bash -lc "pip install -r apps/api/requirements.txt && cd apps/api && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8011:8000"
  web:
    image: node:22-slim
    working_dir: /srv/apps/web
    volumes:
      - ./:/srv
    environment:
      # The Next server resolves this, not the browser, so it uses the compose service name.
      TWIN_API_ORIGIN: http://api:8000
    command: bash -lc "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "3011:3000"
